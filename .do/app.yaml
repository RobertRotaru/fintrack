# DigitalOcean App Platform spec for Fintrack.
#
# Create the app:  Apps → Create App → "Import from app spec" (or: doctl apps create --spec .do/app.yaml),
# then set JWT_SECRET (and optionally ANTHROPIC_API_KEY) under the api component's environment variables.
#
# Everything is served from one domain: the web app at /, the API at /api — the
# web app calls /api on its own origin, so no CORS setup is needed.
name: fintrack
region: fra

services:
  - name: api
    github:
      repo: RobertRotaru/fintrack
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 4000
    # Spring Boot needs more than the 512 MB of the smallest size.
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 40
      period_seconds: 10
      timeout_seconds: 3
    envs:
      # The managed database below, in the form the Java driver expects.
      - key: DB_URL
        scope: RUN_TIME
        value: jdbc:postgresql://${db.HOSTNAME}:${db.PORT}/${db.DATABASE}?sslmode=require
      - key: DB_USER
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${db.PASSWORD}
      # A random string of at least 32 characters. Until it is set, the API refuses to start.
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Optional: enables the AI investing coach.
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Profile photos live in Cloudflare R2 (README → Profile photos). Fill in the R2_* values below; the API
      # won't start with STORAGE_DRIVER=r2 until they're all set.
      - key: STORAGE_DRIVER
        scope: RUN_TIME
        value: r2
      - key: R2_ACCOUNT_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_BUCKET
        scope: RUN_TIME
        value: fintrack-photos
      - key: R2_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      # The bucket's public address: a custom domain (recommended) or its r2.dev URL.
      - key: R2_PUBLIC_URL
        scope: RUN_TIME
        value: https://photos.example.com

static_sites:
  - name: web
    github:
      repo: RobertRotaru/fintrack
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build -w web
    output_dir: web/dist
    # Client-side routes (/goals, /reports, …) load the app instead of a 404.
    catchall_document: index.html

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        # Keep /api in the path: the backend's routes start with /api.
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

databases:
  # A dev database: small and cheap. For production use, switch to a managed
  # cluster (production: true, cluster_name: …) for backups and failover.
  - name: db
    engine: PG
    production: false
