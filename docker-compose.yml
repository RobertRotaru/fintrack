# Local PostgreSQL for development:   docker compose up -d db   (or: npm run db:up)
# Database + API, as in production:   docker compose --profile full up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fintrack
      DB_USER: fintrack
      DB_PASSWORD: ${DB_PASSWORD:-fintrack}
      # Required: at least 32 characters (the API refuses to start without it).
      JWT_SECRET: ${JWT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "4000:4000"

volumes:
  pgdata:
